<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chess Tutor</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{--paper:#F3EEE3;--paper-2:#E8E1D2;--ink:#22302C;--ink-2:#5A6A64;--board:#2F4A44;--chalk:#F1EBDD;--amber:#E9A93B;--mint:#7FD1AE;--rose:#E27A6E;--line:#CFC6B2;--panel:#FBF8F1;
 --skin:#D9A47F;--hair:#3A2A26;--shirt:#3B6B8F}
@media (prefers-color-scheme:dark){:root{--paper:#1B2426;--paper-2:#24302F;--ink:#EDE7DA;--ink-2:#A9B3AD;--board:#233835;--line:#3A4A47;--panel:#212C2B}}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,sans-serif;line-height:1.5}
h1,h3{font-family:Fraunces,Georgia,serif;font-weight:500;margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:.45rem .8rem}
button.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
button[aria-pressed="true"]{background:var(--rose);color:#fff;border-color:var(--rose)}
select,input{font:inherit;padding:.45rem .6rem;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink)}
header{display:flex;align-items:center;gap:1rem;padding:.75rem 1rem;border-bottom:1px solid var(--line);flex-wrap:wrap}
header .conn{margin-left:auto;font-size:.85rem;color:var(--ink-2)}
main{display:grid;grid-template-columns:minmax(280px,34%) 1fr;gap:1rem;padding:1rem;max-width:1400px;margin:0 auto}
@media(max-width:820px){main{grid-template-columns:1fr}}
.avatar-frame{position:relative;background:var(--paper-2);border-radius:14px;overflow:hidden;aspect-ratio:4/3;border:1px solid var(--line)}
.avatar-frame svg,.avatar-frame video{width:100%;height:100%;display:block;object-fit:cover}
.live{position:absolute;top:.6rem;left:.6rem;font-size:.8rem;color:var(--ink-2);display:flex;gap:.4rem;align-items:center}
.live i{width:.55rem;height:.55rem;border-radius:50%;background:var(--ink-2);display:inline-block}
.talking .live i{background:var(--rose);animation:p 1s infinite}@keyframes p{50%{opacity:.35}}
@media(prefers-reduced-motion:no-preference){.head{animation:idle 6s ease-in-out infinite;transform-origin:200px 150px}@keyframes idle{50%{transform:rotate(-1.2deg) translateY(2px)}}}
.caption{min-height:4.5rem;padding:.75rem 1rem;background:var(--panel);border:1px solid var(--line);border-radius:12px;font-family:Fraunces,Georgia,serif;font-size:1.05rem;margin-top:.75rem}
.caption .who{display:block;font-family:"Atkinson Hyperlegible",sans-serif;font-size:.8rem;color:var(--ink-2)}
.row{display:flex;gap:.5rem;margin-top:.6rem;flex-wrap:wrap}.row input{flex:1}
.lesson{margin-top:.8rem;font-size:.92rem}.lesson ol{padding-left:1.3rem;color:var(--ink-2);margin:.3rem 0}.lesson li.now{color:var(--ink);font-weight:700}.lesson li.done{text-decoration:line-through}
.stage{background:var(--board);border-radius:14px;padding:1rem;display:flex;align-items:center;justify-content:center;border:1px solid var(--line)}
#chess{width:min(100%,560px);aspect-ratio:1}
#chess .sq.light{fill:#E9E1CB}#chess .sq.dark{fill:#6F8F7F}#chess .sq.sel{fill:var(--amber)}
#chess .hl{fill:var(--amber);opacity:.55}#chess .hl.red{fill:var(--rose)}#chess .hl.green{fill:var(--mint)}
#chess .piece{font-size:44px;text-anchor:middle;dominant-baseline:central;pointer-events:none;user-select:none}
#chess .piece.w{fill:#fff;stroke:#1a1a1a;stroke-width:1.3px;paint-order:stroke}#chess .piece.b{fill:#1a1a1a}
#chess .arrow{stroke:var(--amber);stroke-width:9;stroke-linecap:round;opacity:.9;stroke-dasharray:600;stroke-dashoffset:600;animation:draw .6s ease-out forwards}
#chess .arrowhead{opacity:0;animation:fadein .2s .45s forwards}
@keyframes draw{to{stroke-dashoffset:0}}@keyframes fadein{to{opacity:1}}
#chess .hl{animation:pulse-hl 1.2s ease-in-out 2}
@keyframes pulse-hl{0%{opacity:0}30%{opacity:.75}100%{opacity:.55}}
#chess .flash{fill:var(--amber);opacity:0;animation:flash 1.1s ease-out forwards;pointer-events:none}
@keyframes flash{0%{opacity:0}15%{opacity:.85}100%{opacity:0}}
#chess .piece.moving{transition:transform .55s cubic-bezier(.4,.1,.2,1)}
#chess .coord{font-size:11px;fill:#1f2f2a;opacity:.7}
.eye circle{transition:transform .35s}.look-board .eye circle{transform:translate(4px,1px)}
.look-board .head{animation:none}
@media(prefers-reduced-motion:reduce){#chess .arrow,#chess .hl,#chess .flash{animation:none;stroke-dashoffset:0;opacity:.6}#chess .piece.moving{transition:none}}
.note{color:var(--ink-2);font-size:.9rem;margin-top:.5rem}
.hidden{display:none}
.review{margin-top:.8rem;border:1px solid var(--line);border-radius:12px;padding:.6rem .9rem;background:var(--panel)}
.review summary{cursor:pointer;font-family:Fraunces,Georgia,serif;font-size:1.05rem}
.games{display:flex;flex-direction:column;gap:.3rem;margin-top:.5rem;max-height:11rem;overflow:auto}
.games button{text-align:left;display:flex;gap:.6rem;align-items:baseline}
.games .res{width:3rem;font-weight:700}.games .res.win{color:#2e8b57}.games .res.loss{color:var(--rose)}
.moves{display:grid;grid-template-columns:2.2rem 1fr 1fr;gap:.15rem .5rem;margin-top:.5rem;font-size:.92rem;max-height:14rem;overflow:auto}
.moves span{padding:.1rem .3rem;border-radius:4px;cursor:pointer}.moves span.cur{outline:2px solid var(--amber)}
.moves .num{color:var(--ink-2);cursor:default}
.moves .best{color:#2e8b57}.moves .inaccuracy{color:#b8860b}.moves .mistake{color:#d2691e}.moves .blunder,.moves .missed_mate{color:var(--rose);font-weight:700}
.progress{height:4px;background:var(--line);border-radius:2px;margin-top:.4rem;overflow:hidden}.progress i{display:block;height:100%;background:var(--amber);width:0}
</style>
</head>
<body>
<header>
  <h1>Chess Tutor</h1>
  <span class="note">Local stack: Stockfish + Qwen3 + Kokoro/Chatterbox + Whisper</span>
  <span class="conn" id="conn">connecting…</span>
  <span class="conn" id="caps" style="margin-left:0;flex-basis:100%"></span>
</header>
<main>
  <section>
    <div class="avatar-frame" id="frame">
      <div class="live"><i></i><span id="liveText">Ready</span></div>
      <!-- Swap this SVG for a <video id="face"> fed by MuseTalk when AVATAR=musetalk -->
      <svg viewBox="0 0 400 300" role="img" aria-label="Tutor avatar">
        <path d="M60 300 C70 230 130 215 200 215 C270 215 330 230 340 300 Z" fill="var(--shirt)"/>
        <path d="M175 215 L200 250 L225 215 Z" fill="#F3EEE3"/>
        <g class="head">
          <rect x="178" y="180" width="44" height="45" rx="14" fill="var(--skin)"/>
          <ellipse cx="132" cy="150" rx="12" ry="18" fill="var(--skin)"/><ellipse cx="268" cy="150" rx="12" ry="18" fill="var(--skin)"/>
          <ellipse cx="200" cy="140" rx="68" ry="82" fill="var(--skin)"/>
          <path d="M132 130 C128 70 165 50 200 52 C240 52 274 75 268 130 C262 100 240 92 200 92 C160 92 140 105 132 130 Z" fill="var(--hair)"/>
          <path d="M160 112 Q175 104 190 110" stroke="var(--hair)" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M210 110 Q225 104 240 112" stroke="var(--hair)" stroke-width="5" fill="none" stroke-linecap="round"/>
          <g class="eye" style="transform-origin:175px 132px"><ellipse cx="175" cy="132" rx="9" ry="7" fill="#fff"/><circle cx="177" cy="133" r="4.2" fill="#2A211F"/></g>
          <g class="eye" style="transform-origin:225px 132px"><ellipse cx="225" cy="132" rx="9" ry="7" fill="#fff"/><circle cx="227" cy="133" r="4.2" fill="#2A211F"/></g>
          <path d="M200 140 L194 160 Q200 165 206 160 Z" fill="#C48D67" opacity=".8"/>
          <g id="mouth">
            <path data-v="rest" d="M180 184 Q200 194 220 184" stroke="#8C3F3A" stroke-width="4" fill="none" stroke-linecap="round"/>
            <path data-v="M" class="hidden" d="M182 185 L218 185" stroke="#8C3F3A" stroke-width="5" fill="none" stroke-linecap="round"/>
            <path data-v="E" class="hidden" d="M178 181 Q200 179 222 181 Q200 196 178 181 Z" fill="#6B2A2A"/>
            <path data-v="A" class="hidden" d="M180 178 Q200 176 220 178 Q220 204 200 206 Q180 204 180 178 Z" fill="#6B2A2A"/>
            <path data-v="O" class="hidden" d="M188 178 Q200 174 212 178 Q216 192 200 200 Q184 192 188 178 Z" fill="#6B2A2A"/>
            <path data-v="C" class="hidden" d="M182 182 Q200 181 218 182 Q200 192 182 182 Z" fill="#6B2A2A"/>
          </g>
        </g>
      </svg>
    </div>
    <div class="caption"><span class="who">Ms. Ada</span><span id="captionText">Connecting to the local tutor server…</span></div>
    <form class="row" id="askForm"><input id="askInput" placeholder="Ask the coach…" autocomplete="off"><button type="button" id="mic" aria-pressed="false">Mic</button><button class="primary">Ask</button></form>
    <div class="lesson">
      <div class="row" style="margin-top:0"><select id="lessonSel"></select><button class="primary" id="startLesson">Start lesson</button><button id="nextStep">Next step</button><button id="hint">Hint</button></div>
      <h3 id="lessonTitle" style="margin-top:.6rem"></h3><ol id="steps"></ol>
      <div class="row"><select id="level"><option value="1">Level 1 (beginner)</option><option value="5" selected>Level 5</option><option value="10">Level 10</option><option value="16">Level 16</option><option value="20">Level 20 (full strength)</option></select><button id="newGame">Play a game</button><button id="stop">Stop talking</button></div>
    </div>
  </section>
  <section>
    <div class="stage"><svg id="chess" viewBox="0 0 480 480"></svg></div>
    <div class="note" id="note">Click a piece, then a square.</div>
    <details class="review" id="reviewPanel">
      <summary>Review my game</summary>
      <div class="row"><select id="source"><option value="chess.com">chess.com</option><option value="lichess">Lichess</option></select>
        <input id="username" placeholder="username" autocomplete="off" style="max-width:14rem"><button id="fetchGames">Fetch games</button></div>
      <div id="gamesList" class="games"></div>
      <div class="row"><textarea id="pgn" placeholder="…or paste a PGN here" rows="2" style="flex:1;font:inherit;padding:.4rem .6rem;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink)"></textarea><button id="reviewPgn">Review PGN</button></div>
      <div id="reviewBox" class="hidden">
        <div class="row" style="align-items:center"><span id="reviewSummary" class="note" style="margin:0"></span></div>
        <div class="row"><button id="rvStart">⏮</button><button id="rvPrev">◀ Prev</button><button id="rvNext">Next ▶</button><button class="primary" id="rvKey">Next key moment</button><button id="rvWalk">Walk me through all</button></div>
        <div id="moveList" class="moves"></div>
      </div>
    </details>
  </section>
</main>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
/* ---- avatar ---- */
const mouth=$$('#mouth path'), frame=$('#frame'); let mouthTimer=null;
const viseme=v=>mouth.forEach(p=>p.classList.toggle('hidden',p.dataset.v!==v));
const vFor=c=>{c=c.toLowerCase();return 'a'.includes(c)?'A':'eiy'.includes(c)?'E':'ouw'.includes(c)?'O':'mbp'.includes(c)?'M':/[a-z]/.test(c)?'C':'rest'};
(async()=>{for(;;){await new Promise(r=>setTimeout(r,2500+Math.random()*3500));if(reduced)continue;$$('.eye').forEach(e=>e.style.transform='scaleY(.1)');await new Promise(r=>setTimeout(r,110));$$('.eye').forEach(e=>e.style.transform='')}})();
function stopMouth(){clearInterval(mouthTimer);mouthTimer=null;viseme('rest')}
function talking(on){frame.classList.toggle('talking',on);$('#liveText').textContent=on?'Speaking':'Ready';if(!on)stopMouth()}
let audioCtx, currentAudio=null, synth=window.speechSynthesis, voice=null;
if(synth){const pick=()=>{const v=synth.getVoices();voice=v.find(x=>/en/i.test(x.lang)&&/female|samantha|zira|aria|jenny|karen|moira/i.test(x.name))||v.find(x=>/en/i.test(x.lang))||null};pick();synth.onvoiceschanged=pick}
async function say(text,audioB64){
  $('#captionText').textContent=text; stopSpeech();
  if(audioB64){ // server voice: drive the mouth from audio amplitude
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    const bytes=Uint8Array.from(atob(audioB64),c=>c.charCodeAt(0));
    const buf=await audioCtx.decodeAudioData(bytes.buffer);
    const src=audioCtx.createBufferSource(); src.buffer=buf; const an=audioCtx.createAnalyser(); an.fftSize=512; src.connect(an); an.connect(audioCtx.destination);
    const data=new Uint8Array(an.frequencyBinCount); talking(true); currentAudio=src;
    const words=text.split(/\s+/);words.forEach((w,i)=>{const sqm=w.toLowerCase().match(/^([a-h][1-8])\b/);if(sqm)setTimeout(()=>flashSquare(sqm[1]),buf.duration*1000*i/words.length)});
    mouthTimer=setInterval(()=>{an.getByteTimeDomainData(data);let s=0;for(const d of data)s+=Math.abs(d-128);const amp=s/data.length;viseme(amp<3?'rest':amp<7?'C':amp<12?'E':amp<18?'A':'O')},60);
    await new Promise(r=>{src.onended=r;src.start()}); talking(false); currentAudio=null; return;
  }
  if(!synth){talking(true);await new Promise(r=>setTimeout(r,Math.max(1200,text.length*55)));talking(false);return}
  await new Promise(res=>{const u=new SpeechSynthesisUtterance(text);if(voice)u.voice=voice;u.pitch=1.05;
    u.onstart=()=>{talking(true);mouthTimer=setInterval(()=>viseme(['A','E','O','C','M','rest'][Math.random()*6|0]),90)};
    u.onboundary=e=>{if(e.name&&e.name!=='word')return;const raw=(text.slice(e.charIndex).match(/^\S+/)||['a'])[0];const sqm=raw.toLowerCase().match(/^([a-h][1-8])\b/);if(sqm)flashSquare(sqm[1]);const w=raw.replace(/[^a-z]/gi,'');clearInterval(mouthTimer);let i=0;mouthTimer=setInterval(()=>{if(i>=w.length){viseme('rest');clearInterval(mouthTimer);return}viseme(vFor(w[i++]))},70)};
    u.onend=u.onerror=()=>{talking(false);res()}; synth.speak(u)});
}
function stopSpeech(){if(synth)synth.cancel();if(currentAudio){try{currentAudio.stop()}catch(e){}currentAudio=null}talking(false)}
/* ---- board ---- */
const svg=$('#chess'), files='abcdefgh', glyph={k:'♚',q:'♛',r:'♜',b:'♝',n:'♞',p:'♟'};
let fen='rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1', turn='w', selected=null, hls=[], arrows=[];
function parse(f){const rows=f.split(' ')[0].split('/'),b=[];for(const r of rows){const row=[];for(const ch of r){if(/\d/.test(ch))for(let i=0;i<+ch;i++)row.push(null);else row.push({type:ch.toLowerCase(),color:ch===ch.toUpperCase()?'w':'b'})}b.push(row)}return b}
const xy=sq=>({x:files.indexOf(sq[0])*60,y:(8-+sq[1])*60});
function render(){let o='';const b=parse(fen);
  for(let r=0;r<8;r++)for(let f=0;f<8;f++){const sq=files[f]+(8-r);o+=`<rect class="sq ${(r+f)%2?'dark':'light'} ${selected===sq?'sel':''}" data-sq="${sq}" x="${f*60}" y="${r*60}" width="60" height="60"/>`}
  for(const h of hls){const p=xy(h.sq);o+=`<rect class="hl ${h.color||''}" x="${p.x}" y="${p.y}" width="60" height="60" pointer-events="none"/>`}
  for(let f=0;f<8;f++)o+=`<text class="coord" x="${f*60+3}" y="476">${files[f]}</text>`;for(let r=0;r<8;r++)o+=`<text class="coord" x="470" y="${r*60+12}">${8-r}</text>`;
  for(let r=0;r<8;r++)for(let f=0;f<8;f++){const p=b[r][f];if(p)o+=`<text class="piece ${p.color}" data-at="${files[f]}${8-r}" x="${f*60+30}" y="${r*60+30}">${glyph[p.type]}</text>`}
  for(const a of arrows){const A=xy(a.from),B=xy(a.to),x1=A.x+30,y1=A.y+30,x2=B.x+30,y2=B.y+30,g=Math.atan2(y2-y1,x2-x1),h=16;
    o+=`<line class="arrow" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" pointer-events="none"/><polygon class="arrowhead" points="${x2},${y2} ${x2-h*Math.cos(g-.5)},${y2-h*Math.sin(g-.5)} ${x2-h*Math.cos(g+.5)},${y2-h*Math.sin(g+.5)}" fill="var(--amber)" pointer-events="none"/>`}
  svg.innerHTML=o}
svg.addEventListener('click',e=>{const sq=e.target.dataset&&e.target.dataset.sq;if(!sq)return;const b=parse(fen);const p=b[8-+sq[1]][files.indexOf(sq[0])];
  if(selected){if(sq!==selected){send({type:'move',from:selected,to:sq});stopSpeech()}selected=null;render();return}
  if(p&&p.color===turn){selected=sq;render()}});
function animateMove(from,to,newFen){
  const el=svg.querySelector(`.piece[data-at="${from}"]`);
  if(!el||reduced){fen=newFen;render();return Promise.resolve()}
  const A=xy(from),B=xy(to);el.classList.add('moving');el.style.transform=`translate(${B.x-A.x}px,${B.y-A.y}px)`;
  const cap=svg.querySelector(`.piece[data-at="${to}"]`);if(cap)cap.style.opacity='.35';
  return new Promise(r=>setTimeout(()=>{fen=newFen;render();r()},560))}
function flashSquare(sq){if(!/^[a-h][1-8]$/.test(sq))return;const p=xy(sq);const n=document.createElementNS('http://www.w3.org/2000/svg','rect');
  n.setAttribute('class','flash');n.setAttribute('x',p.x);n.setAttribute('y',p.y);n.setAttribute('width',60);n.setAttribute('height',60);svg.appendChild(n);setTimeout(()=>n.remove(),1200);lookAtBoard()}
let gazeTimer=null;function lookAtBoard(ms=1600){frame.classList.add('look-board');clearTimeout(gazeTimer);gazeTimer=setTimeout(()=>frame.classList.remove('look-board'),ms)}
function stage(actions){if(actions.length)lookAtBoard(2500);for(const a of actions){if(a.type==='highlight'){hls=a.squares.map(sq=>({sq,color:a.color||''}))}else if(a.type==='arrow')arrows.push(a);else if(a.type==='clear'){hls=[];arrows=[]}}render()}
/* ---- websocket ---- */
let ws, queue=Promise.resolve();
function connect(){ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');
  ws.onopen=()=>$('#conn').textContent='connected';ws.onclose=()=>{$('#conn').textContent='disconnected, retrying…';setTimeout(connect,2000)};
  ws.onmessage=ev=>{const m=JSON.parse(ev.data);
    if(m.type==='state'){turn=m.turn;if(reviewData&&m.mode==='review'){const i=reviewData.moves.findIndex(x=>x.fen_after===m.fen);reviewPly=i>=0?i+1:0;markCur()}
      const lm=m.last_move;const canAnim=lm&&lm.from&&lm.to&&svg.querySelector(`.piece[data-at="${lm.from}"]`);
      if(m.fresh){hls=[];arrows=[]}
      if(lm){hls=lm.from?[{sq:lm.from,color:'green'},{sq:lm.to,color:'green'}]:[];arrows=[]}
      if(canAnim){const nf=m.fen;queue=queue.then(()=>{lookAtBoard(2000);return animateMove(lm.from,lm.to,nf)})}else{fen=m.fen;queue=queue.then(()=>render())}$('#note').textContent=m.mode==='puzzle'?'Puzzle: find the move.':m.game_over?`Game over ${m.result||''}`:(turn==='w'?'White to move.':'Black to move.')}
    else if(m.type==='stage'){const nonBoard=m.actions.filter(a=>a.type!=='fen'&&a.type!=='move');if(m.actions.some(a=>a.type==='fen'||a.type==='move')){hls=[];arrows=[]}queue=queue.then(()=>stage(nonBoard))}
    else if(m.type==='say'){queue=queue.then(()=>say(m.text,m.audio))}
    else if(m.type==='lesson'){$('#lessonTitle').textContent=m.title;$('#steps').innerHTML=m.steps.map((s,i)=>`<li class="${i<m.step?'done':i===m.step?'now':''}">${s.split(/[.!?]/)[0]}.</li>`).join('')}
    else if(m.type==='lessons'){$('#lessonSel').innerHTML=m.items.map(i=>`<option value="${i.id}">${i.title} (${i.level})</option>`).join('')}
    else if(m.type==='transcript'){$('#captionText').textContent='You: '+m.text}
    else if(m.type==='thinking'){$('#captionText').textContent=m.text;$('#liveText').textContent='Thinking'}
    else if(m.type==='games'){renderGames(m)}
    else if(m.type==='review_progress'){$('#reviewSummary').innerHTML=`Analysing move ${Math.ceil(m.ply/2)} of ${Math.ceil(m.total/2)}…<div class="progress"><i style="width:${100*m.ply/m.total}%"></i></div>`;$('#reviewBox').classList.remove('hidden')}
    else if(m.type==='review'){renderReview(m)}
    else if(m.type==='capabilities'){serverSTT=m.stt;$('#caps').textContent=`engine ✓ · LLM ${m.llm?'✓':'✗ ('+m.llm_note+')'} · voice ${m.tts?'server':'browser'} · ears ${m.stt?'server':(SR?'browser':'none')}`;$('#caps').title=m.llm_note}}}
const send=o=>ws&&ws.readyState===1&&ws.send(JSON.stringify(o));
connect();render();
$('#startLesson').onclick=()=>{stopSpeech();send({type:'lesson',id:$('#lessonSel').value})};
$('#nextStep').onclick=()=>{stopSpeech();send({type:'lesson_next'})};
$('#hint').onclick=()=>{stopSpeech();send({type:'hint'})};
$('#newGame').onclick=()=>{stopSpeech();$('#lessonTitle').textContent='';$('#steps').innerHTML='';send({type:'new_game',level:+$('#level').value})};
$('#stop').onclick=stopSpeech;
$('#askForm').onsubmit=e=>{e.preventDefault();const q=$('#askInput').value.trim();if(!q)return;$('#askInput').value='';stopSpeech();$('#captionText').textContent='You: '+q;send({type:'ask',text:q})};
/* ---- game review ---- */
let reviewData=null, reviewPly=0, reviewUser='';
function renderGames(m){reviewUser=m.username||'';const el=$('#gamesList');
  if(!m.items.length){el.innerHTML='<span class="note">No games found.</span>';return}
  el.innerHTML=m.items.map(g=>`<button data-id="${g.id}"><span class="res ${g.result}">${g.result}</span><span>${g.white} vs ${g.black}</span><span class="note" style="margin:0">${g.date} · ${g.time_class}</span></button>`).join('');
  el.querySelectorAll('button').forEach(b=>b.onclick=()=>{stopSpeech();$('#reviewBox').classList.remove('hidden');$('#reviewSummary').textContent='Fetching…';send({type:'review',game_id:b.dataset.id,username:reviewUser})})}
function renderReview(m){reviewData=m;reviewPly=0;$('#reviewBox').classList.remove('hidden');$('#reviewPanel').open=true;
  const s=m.summary,c=s.counts;$('#reviewSummary').textContent=`${s.white} vs ${s.black} · ${s.result} · you played ${s.colour} · accuracy ${s.accuracy}% · ${c.best} best, ${c.mistake} mistakes, ${c.blunder+c.missed_mate} blunders`;
  let html='';m.moves.forEach((mv,i)=>{if(mv.colour==='w')html+=`<span class="num">${Math.ceil(mv.ply/2)}.</span>`;if(i===0&&mv.colour==='b')html+=`<span class="num">1.</span><span></span>`;
    html+=`<span class="${mv.label||''}" data-ply="${mv.ply}" title="${mv.best_san?'best: '+mv.best_san:''}">${mv.san}${mv.label==='blunder'||mv.label==='missed_mate'?' ??':mv.label==='mistake'?' ?':mv.label==='inaccuracy'?' ?!':mv.label==='best'?' !':''}</span>`});
  $('#moveList').innerHTML=html;$('#moveList').querySelectorAll('[data-ply]').forEach(e=>e.onclick=()=>goto(+e.dataset.ply,true));markCur()}
function markCur(){$('#moveList').querySelectorAll('[data-ply]').forEach(e=>e.classList.toggle('cur',+e.dataset.ply===reviewPly));const cur=$('#moveList .cur');if(cur)cur.scrollIntoView({block:'nearest'})}
function goto(ply,explain){if(!reviewData)return;reviewPly=Math.max(0,Math.min(ply,reviewData.moves.length));stopSpeech();send({type:'review_goto',ply:reviewPly,explain});markCur()}
$('#fetchGames').onclick=()=>{const u=$('#username').value.trim();if(!u)return;$('#gamesList').innerHTML='<span class="note">Fetching…</span>';send({type:'games',source:$('#source').value,username:u})};
$('#reviewPgn').onclick=()=>{const p=$('#pgn').value.trim();if(!p)return;stopSpeech();$('#reviewBox').classList.remove('hidden');$('#reviewSummary').textContent='Reading PGN…';send({type:'review',pgn:p,username:$('#username').value.trim()})};
$('#rvStart').onclick=()=>goto(0,false);$('#rvPrev').onclick=()=>goto(reviewPly-1,false);$('#rvNext').onclick=()=>goto(reviewPly+1,true);
$('#rvKey').onclick=()=>{stopSpeech();send({type:'review_next_key'})};
$('#rvWalk').onclick=()=>{stopSpeech();send({type:'review_walk'})};
// keep reviewPly in step when the server moves us (next key moment)
const _origOnState=null;
/* mic: server Whisper if installed, otherwise the browser's own speech recognition */
let rec=null, chunks=[], serverSTT=false, listening=false;
const SR=window.SpeechRecognition||window.webkitSpeechRecognition; let recog=null;
if(SR){recog=new SR();recog.lang='en-US';recog.interimResults=true;
  recog.onresult=e=>{const t=[...e.results].map(r=>r[0].transcript).join(' ');$('#askInput').value=t;if(e.results[e.results.length-1].isFinal){recog.stop();$('#askInput').value='';$('#captionText').textContent='You: '+t;send({type:'ask',text:t})}};
  recog.onend=()=>{listening=false;$('#mic').setAttribute('aria-pressed','false');$('#liveText').textContent='Ready'};
  recog.onerror=e=>{listening=false;$('#mic').setAttribute('aria-pressed','false');$('#captionText').textContent='Mic error: '+e.error+(e.error==='not-allowed'?' (allow microphone access for localhost in the address bar)':'')}}
$('#mic').onclick=async()=>{
  if(!serverSTT){ if(!recog){$('#captionText').textContent='No speech recognition available: install faster-whisper on the server or use Chrome/Edge.';return}
    if(listening){recog.stop();return} stopSpeech();try{recog.start();listening=true;$('#mic').setAttribute('aria-pressed','true');$('#liveText').textContent='Listening'}catch(e){} return }
  if(rec){rec.stop();return}
  try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});rec=new MediaRecorder(stream);chunks=[];rec.ondataavailable=e=>chunks.push(e.data);
    rec.onstop=async()=>{stream.getTracks().forEach(t=>t.stop());$('#mic').setAttribute('aria-pressed','false');const blob=new Blob(chunks,{type:rec.mimeType});rec=null;
      const wav=await toWav(blob);send({type:'audio',wav});$('#captionText').textContent='Listening done, transcribing…'};
    rec.start();$('#mic').setAttribute('aria-pressed','true');stopSpeech();$('#liveText').textContent='Listening';
  }catch(e){$('#captionText').textContent='Microphone not available: '+e.message}};
async function toWav(blob){audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();const buf=await audioCtx.decodeAudioData(await blob.arrayBuffer());const ch=buf.getChannelData(0),sr=buf.sampleRate,n=ch.length,out=new DataView(new ArrayBuffer(44+n*2));
  const w=(o,s)=>{for(let i=0;i<s.length;i++)out.setUint8(o+i,s.charCodeAt(i))};w(0,'RIFF');out.setUint32(4,36+n*2,true);w(8,'WAVE');w(12,'fmt ');out.setUint32(16,16,true);out.setUint16(20,1,true);out.setUint16(22,1,true);out.setUint32(24,sr,true);out.setUint32(28,sr*2,true);out.setUint16(32,2,true);out.setUint16(34,16,true);w(36,'data');out.setUint32(40,n*2,true);
  for(let i=0;i<n;i++){const s=Math.max(-1,Math.min(1,ch[i]));out.setInt16(44+i*2,s<0?s*0x8000:s*0x7FFF,true)}
  return btoa(String.fromCharCode(...new Uint8Array(out.buffer)))}
</script>
