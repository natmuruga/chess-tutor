services:
  ollama:
    image: ollama/ollama:latest
    volumes: ["ollama:/root/.ollama"]
    ports: ["11434:11434"]
    # GPU (NVIDIA): uncomment
    # deploy: { resources: { reservations: { devices: [{ driver: nvidia, count: all, capabilities: [gpu] }] } } }
  tutor:
    build: .
    ports: ["8000:8000"]
    environment:
      OLLAMA_URL: http://ollama:11434
      LLM_MODEL: qwen3:8b        # qwen3:4b on 8 GB cards / CPU-only laptops
      USE_LLM: "1"
      TTS_ENGINE: kokoro         # none -> browser voice; chatterbox -> cloned voice (GPU)
      ENGINE_DEPTH: "14"
      COACH_NAME: "Ms. Ada"
    depends_on: [ollama]
volumes:
  ollama: {}
